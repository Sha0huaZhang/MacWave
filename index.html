<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacWave 🌊</title>
    <style>
        body {
            background-color: #0a1b3f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        /* White rounded card container */
        .logo-container {
            background-color: #ffffff;
            padding: 25px 45px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .logo-img {
            height: 55px;
            width: auto;
            display: block;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 10px 0;
            letter-spacing: -1px;
        }

        p {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 40px;
            max-width: 600px;
        }

        .btn-github {
            display: inline-block;
            background-color: #ffffff;
            color: #0a1b3f;
            padding: 14px 32px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-github:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255,255,255,0.2);
        }

        .footer {
            margin-top: 50px;
            font-size: 0.9rem;
            opacity: 0.5;
        }

        .footer a {
            color: #4a90e2;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .logo-container {
                padding: 15px 30px;
                border-radius: 20px;
            }
            .logo-img {
                height: 45px;
            }
        }
    </style>
</head>
<body>

    <!-- White rounded card container -->
    <div class="logo-container">
        <img src="logo.jpg" alt="MacWave Logo" class="logo-img">
    </div>

    <h1>MacWave</h1>
    <p>A package manager for macOS/Linux jailbreak developers.</p>

    <a href="https://github.com/Sha0huaZhang/MacWave" class="btn-github">View On GitHub</a>

    <div class="footer">
        <a href="mailto:hi@macwave.org">hi@macwave.org</a>
    </div>

</body>
</html>
